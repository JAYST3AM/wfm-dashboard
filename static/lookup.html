<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WFM Trader — Search</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<!-- Item lookup is now the global search in the main app (it opens the shared item
     drawer for owned and unowned items alike). This page is a stub so old
     /lookup.html and /lookup.html?q=... links keep working. -->
<script>
(function () {
  var q = (location.search || '').replace(/^\?/, '');
  location.replace('/#search' + (q ? '?' + q : ''));
})();
</script>
<meta http-equiv="refresh" content="0; url=/#search">
</head>
<body>
<main>
  <div class="card">
    <div class="card-head"><div class="card-title">Item search has moved</div></div>
    <div class="picks">
      <a class="movedlink" href="/#search">Open the item search →</a>
    </div>
  </div>
</main>
</body>
</html>
