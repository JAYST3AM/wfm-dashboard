<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WFM Trader · Mod Cards</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/shell.css">

<style>
  /* ---- mod cards page (TCG grid on the dashboard's CSS vars) ----
     Structure/colour come from theme.js vars (--panel/--panel2/--border/--text/
     --muted/--accent/--accent-dim/--hover) so every theme works. Rarity hues are
     semantic (bronze/silver/gold/foil) and are mixed INTO those vars, never used
     as a stand-in for theme colour. */
  :root {
    --r-common: #b87333;   /* bronze  */
    --r-uncommon: #b9c2cc; /* silver  */
    --r-rare: #e0b431;     /* gold    */
    --r-prime: #c9a227;    /* foil base */
    --pip: color-mix(in srgb, var(--text) 55%, transparent);
  }
  /* nav: the pill row wraps inside its own box once it is wider than the window, instead of
     pushing the whole document sideways (page-local; style.css is shared and stays untouched) */
  /* Cards is a Collection section now: the sub-tab row gets its own line directly under the
     pill bar and reuses the same pill styling (no new colours, no new tokens) */
  .mainnav.subnav { display: flex; width: fit-content; margin: 2px 0 0 18px; padding: 3px; }

  /* layout + density (wrap, toolbar, filter rows, meta, grid, tile text, foot) live in
     /cards.css - loaded right after style.css, one home for every number this page uses.
     What stays here: the card face visuals, rarity bands, the foil layers and the
     inspect lightroom. */

  /* ---- TCG grid (see cards.css for gap + column sizing) ---- */
  .mcd-card {
    position: relative; padding: 0; margin: 0; background: none; border: none; cursor: pointer;
    perspective: 900px; font: inherit; color: var(--text); text-align: left;
    aspect-ratio: 5 / 7;
  }
  .mcd-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 13px; }
  .mcd-inner {
    position: absolute; inset: 0; transform-style: preserve-3d;
    transition: transform .42s cubic-bezier(.2, .7, .3, 1);
  }
  /* flip only when explicitly asked (inspect overlay click) — never on hover/focus,
     so simply passing the mouse over the grid never flips a card to its blank back */
  .mcd-card.flipped .mcd-inner {
    transform: rotateY(180deg);
  }
  .mcd-face {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    border-radius: 12px; overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--panel); border: 1px solid var(--border);
    box-shadow: 0 6px 18px color-mix(in srgb, black 28%, transparent);
  }
  .mcd-back { transform: rotateY(180deg); }

  /* ---- holographic foil layers: painted ABOVE the art, never baked in ----
     blend modes (dodge / screen / overlay) give the selective response: bright art
     (gold trim, energy, glows) catches the strongest reflections while dark armour
     stays clean. Layers are clipped to the card radius and never bleed outside. */
  .mcd-foil, .mcd-spec, .mcd-grain {
    position: absolute; inset: 0; pointer-events: none; border-radius: 12px; z-index: 4;
    transition: opacity .35s ease;
  }
  .mcd-card[data-foil="none"] .mcd-foil,
  .mcd-card[data-foil="none"] .mcd-spec,
  .mcd-card[data-foil="none"] .mcd-grain { display: none; }
  .mcd-foil {
    background: conic-gradient(from calc(200deg + (var(--mx, 50) - 50) * 2.4deg),
      rgba(255, 0, 128, .26), rgba(255, 196, 0, .26), rgba(0, 255, 170, .23),
      rgba(0, 150, 255, .26), rgba(170, 0, 255, .23), rgba(255, 0, 128, .26));
    mix-blend-mode: color-dodge; opacity: var(--foil-i, 0);
    transform: rotate(calc((var(--my, 50) - 50) * .16deg)) scale(1.45);
  }
  .mcd-card[data-foil="holo"] .mcd-foil {
    background: conic-gradient(from calc(200deg + (var(--mx, 50) - 50) * 2.2deg),
      rgba(255, 0, 128, .18), rgba(255, 196, 0, .18), rgba(0, 255, 170, .16),
      rgba(0, 150, 255, .18), rgba(170, 0, 255, .16), rgba(255, 0, 128, .18));
  }
  .mcd-card[data-foil="etched"] .mcd-foil {          /* Prime: a metallic sweep + soft foil */
    background:
      linear-gradient(115deg, transparent 14%, rgba(255, 235, 190, .32) 36%, rgba(255, 255, 255, .52) 50%, rgba(255, 235, 190, .32) 64%, transparent 86%),
      conic-gradient(from calc(200deg + (var(--mx, 50) - 50) * 2deg),
        rgba(255, 150, 60, .18), rgba(255, 230, 140, .18), rgba(160, 255, 220, .16),
        rgba(130, 180, 255, .18), rgba(255, 150, 60, .18));
    transform: translateX(calc((var(--mx, 50) - 50) * .45px)) rotate(calc((var(--my, 50) - 50) * .10deg)) scale(1.38);
  }
  .mcd-card[data-foil="legendary"] .mcd-foil {       /* gold + full prism, strongest */
    background:
      linear-gradient(115deg, transparent 10%, rgba(255, 255, 255, .26) 40%, rgba(255, 255, 255, .46) 52%, transparent 88%),
      conic-gradient(from calc(200deg + (var(--mx, 50) - 50) * 2.6deg),
        rgba(255, 0, 140, .34), rgba(255, 200, 0, .34), rgba(0, 255, 180, .30),
        rgba(0, 150, 255, .34), rgba(180, 0, 255, .30), rgba(255, 0, 140, .34));
  }
  .mcd-spec {
    background: radial-gradient(150px 110px at calc(var(--mx, 50) * 1%) calc(var(--my, 50) * 1%),
      rgba(255, 255, 255, .48), rgba(255, 255, 255, 0) 64%);
    mix-blend-mode: screen; opacity: calc(var(--foil-i, 0) * .85);
  }
  .mcd-grain {
    background: repeating-linear-gradient(115deg,
      rgba(255, 255, 255, .13) 0 1px, rgba(0, 0, 0, .09) 1px 2px, transparent 2px 6px);
    mix-blend-mode: overlay; opacity: calc(var(--foil-i, 0) * .6);
  }
  /* grid: subtle 3D tilt toward the cursor (max ~5deg) — vars are set by one delegated listener */
  .mcd-card { transform: perspective(760px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .22s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .mcd-card { transform: none; }
    .mcd-foil, .mcd-spec, .mcd-grain { transition: none; }
  }

  /* full-art fronts: the per-card art (static/cardart/index.json) covers the whole face;
     the standard art window becomes a clear spacer and name/stats ride on scrims */
  .mcd-front.has-fullart {
    /* the art is always dark-ish: force a light palette on the front so the card's own
       wording stays readable in EVERY theme (a light theme's dark text vanishes on art) */
    --text: #f4f7fb; --muted: #b8c2d0; --accent: #ffb454; --accent-dim: #8a5a1a;
    background-image:
      linear-gradient(180deg, rgba(6,7,10,.32) 0%, rgba(6,7,10,.10) 24%, rgba(6,7,10,.02) 48%, rgba(6,7,10,.18) 72%, rgba(6,7,10,.50) 100%),
      var(--cf);
    background-size: 100% 100%, cover;
    background-position: center, center;
    background-repeat: no-repeat, no-repeat;
  }
  .mcd-card .mcd-front.has-fullart .mcd-art { background: none; border-bottom-color: transparent; box-shadow: none; }
  /* full-art wording spec (Jay): the ART is the star — no WARFRAME type label, the polarity
     seal moves to the top-right in brushed silver, and only the name + the mod's own text
     stay on the face; rank/condition/prices live in the inspect panel */
  .mcd-front.has-fullart .mcd-art { display: block; }
  .mcd-front.has-fullart .mcd-art > .mcd-type { display: none; }
  .mcd-front.has-fullart .mcd-art > .mcd-pol {
    position: absolute; top: 6px; right: 8px; z-index: 1;
    font: 700 20px var(--mono); line-height: 1; letter-spacing: 0; text-shadow: none;
    background: linear-gradient(155deg, #ffffff 0%, #d3d9e1 30%, #8e97a4 55%, #eef1f5 76%, #b6bec9 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .8));
  }
  .mcd-front.has-fullart .mcd-art > .mcd-pol-name {
    position: absolute; top: 29px; right: 8px; z-index: 1; text-align: right;
    font: 8px var(--mono); letter-spacing: 1.6px; text-shadow: none;
    background: linear-gradient(180deg, #f4f7fa 0%, #b9c1cb 55%, #e4e8ee 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .8));
  }
  .mcd-front.has-fullart .mcd-body { background: linear-gradient(180deg, rgba(9,10,13,0) 0%, rgba(9,10,13,.16) 30%, rgba(9,10,13,.58) 100%); }
  .mcd-front.has-fullart .mcd-name { color: #fff; text-shadow: 0 1px 4px rgba(0, 0, 0, .95), 0 0 14px rgba(0, 0, 0, .6); }
  .mcd-front.has-fullart .mcd-desc {
    background: rgba(8, 9, 12, .30); border-color: rgba(255, 255, 255, .10);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  /* baked faces: the art file already IS the finished card (frame, title, stats, polarity) —
     draw nothing on top of it and show the whole file edge-to-edge (source is exact 5:7) */
  .mcd-front.has-fullart.art-baked {
    background-image: var(--cf);
    background-size: 100% 100%;
    background-position: center;
  }
  .mcd-front.has-fullart.art-baked::before { display: none; }
  .mcd-front.has-fullart.art-baked .mcd-body { background: none; }
  .mcd-front.has-fullart.art-baked .mcd-name,
  .mcd-front.has-fullart.art-baked .mcd-desc,
  .mcd-front.has-fullart.art-baked .mcd-art > .mcd-pol,
  .mcd-front.has-fullart.art-baked .mcd-art > .mcd-pol-name { display: none; }

  /* rarity border band + tint */
  .mcd-front::before {
    content: ""; position: absolute; inset: 0; border-radius: 12px; padding: 2px;
    background: var(--rarity, var(--border));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events: none;
  }
  .mcd-card.r-common  { --rarity: linear-gradient(150deg, var(--r-common), color-mix(in srgb, var(--r-common) 40%, var(--border))); }
  .mcd-card.r-uncommon { --rarity: linear-gradient(150deg, var(--r-uncommon), color-mix(in srgb, var(--r-uncommon) 40%, var(--border))); }
  .mcd-card.r-rare     { --rarity: linear-gradient(150deg, var(--r-rare), color-mix(in srgb, var(--r-rare) 40%, var(--border))); }
  .mcd-card.r-none     { --rarity: var(--border); }
  /* PRIME / LEGENDARY foil: theme accent woven through a metallic sweep */
  .mcd-card.is-prime, .mcd-card.r-legendary { --rarity: linear-gradient(115deg,
      var(--accent), color-mix(in srgb, var(--accent) 30%, var(--r-prime)) 35%,
      color-mix(in srgb, var(--r-prime) 55%, white) 50%,
      color-mix(in srgb, var(--accent) 30%, var(--r-prime)) 65%, var(--accent)); }
  .mcd-card.is-prime .mcd-art, .mcd-card.r-legendary .mcd-art {
    background:
      radial-gradient(120% 90% at 30% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
      linear-gradient(160deg, color-mix(in srgb, var(--r-prime) 26%, var(--panel2)), var(--panel2));
  }

  .mcd-art {
    position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(160deg, color-mix(in srgb, var(--rarity-tint, var(--border)) 30%, var(--panel2)), var(--panel2));
    box-shadow: inset 0 16px 20px -16px rgba(0, 0, 0, .6), inset 0 -18px 22px -18px rgba(0, 0, 0, .5);
  }
  .mcd-art-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: .93; }
  .mcd-art > .mcd-type, .mcd-art > .mcd-missing-flag { z-index: 1; }
  .mcd-art > .mcd-pol, .mcd-art > .mcd-pol-name { position: relative; z-index: 1; }
  .mcd-art.has-art .mcd-pol, .mcd-art.has-art .mcd-pol-name { display: none; }
  .mcd-art.has-art .mcd-type { color: color-mix(in srgb, white 78%, transparent); text-shadow: 0 1px 4px black; }
  /* the icon IS the complete in-game card (title, stat text and type banner are all baked
     into the image) - the drawn nameplate below it would print the title twice, so an icon
     card shows art only. Sibling combinator on purpose: cards built while the art probe is
     still running (or the big inspect card, built before it enters the DOM) get the class
     later, when the body already exists - the rule still applies. */
  .mcd-front .mcd-art.has-art ~ .mcd-body { display: none; }
  .mcd-front .mcd-art.has-art { border-bottom: 0; }
  .mcd-card.r-common  .mcd-art { --rarity-tint: var(--r-common); }
  .mcd-card.r-uncommon .mcd-art { --rarity-tint: var(--r-uncommon); }
  .mcd-card.r-rare     .mcd-art { --rarity-tint: var(--r-rare); }
  .mcd-dup {
    position: absolute; top: 4px; right: 5px; z-index: 2;
    background: color-mix(in srgb, var(--accent) 20%, var(--panel2));
    border: 1px solid var(--accent-dim); color: var(--accent);
    border-radius: 999px; padding: 1px 6px; font: 700 9.5px var(--mono);
  }

  .mcd-pips { display: flex; gap: 2px; align-items: center; }
  .mcd-pips i { width: 7px; height: 7px; border-radius: 50%; background: var(--border); display: block; }
  .mcd-pips i.on { background: var(--accent); box-shadow: 0 0 5px color-mix(in srgb, var(--accent) 60%, transparent); }
  .mcd-pips i.avail { background: color-mix(in srgb, var(--text) 26%, transparent); }
  .mcd-cond { font: 9px var(--mono); letter-spacing: .04em; padding: 1px 5px; border-radius: 6px; margin-left: 4px; white-space: nowrap; border: 1px solid currentColor; color: var(--muted); }
  .cond-mint { color: #34d399; }
  .cond-nm { color: #86efac; }
  .cond-exc { color: #7dd3fc; }
  .cond-good { color: #fbbf24; }
  .cond-played { color: #fb923c; }
  .cond-poor { color: #f87171; }

  /* missing mods: dimmed + greyscale, no rank pips */
  .mcd-card.missing .mcd-front { filter: grayscale(.85); opacity: .52; }
  .mcd-card.missing:hover .mcd-front { opacity: .8; }
  .mcd-card.missing .mcd-name { color: var(--muted); font-weight: 500; }

  /* back face — ONE universal card back for every card: the Orokin plate art
     (static/cardback.webp) is the design itself. No text on it, so it reads the
     same upside-down; every card detail lives in the inspect panel. */
  .mcd-back {
    padding: 0; overflow: hidden;
    background: #0a0b0d url('/cardback.webp') center / cover no-repeat;
  }
  /* the grade reason line renders inside the inspect details panel */
  .mcd-grade {
    font: 11px var(--mono); color: var(--muted); line-height: 1.6;
    background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .07);
    border-radius: 9px; padding: 7px 9px; margin: 8px 0 0;
  }
  .mcd-grade b { color: var(--text); font-weight: 600; }

  /* ---------- inspect view: black lightroom showcase (three-point studio) ---------- */
  .ins-wrap { position: fixed; inset: 0; z-index: 95; display: flex; align-items: center; justify-content: center; }
  .ins-wrap.hidden { display: none; }
  /* near-black matte room; KEY light (soft softbox, top front-left) + FILL (faint cool, right) */
  .ins-backdrop {
    position: absolute; inset: 0;
    background: radial-gradient(120% 85% at 50% 14%, #17181c 0%, #0b0b0e 45%, #050506 100%);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  .ins-backdrop::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(46% 38% at 30% 6%, rgba(255, 250, 240, .085), rgba(255, 250, 240, 0) 65%);
  }
  .ins-backdrop::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(42% 34% at 78% 30%, rgba(150, 185, 255, .05), rgba(150, 185, 255, 0) 70%);
  }
  .ins-body { position: relative; display: flex; gap: 34px; align-items: center; justify-content: center; max-width: min(1100px, 95vw); max-height: 86vh; }
  .ins-stage { position: relative; flex: 0 0 auto; width: 380px; height: 500px; display: flex; align-items: center; justify-content: center; perspective: 1400px; }
  .ins-stage::before {          /* matte floor pool: grounds the card in the room */
    content: ""; position: absolute; left: 50%; bottom: 4%; width: 90%; height: 20%;
    transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(50% 50% at 50% 50%, rgba(255, 255, 255, .13), rgba(255, 255, 255, .05) 52%, transparent 78%);
  }
  .ins-stage::after {           /* contact glow + mirrored reflection under the card */
    content: ""; position: absolute; left: 50%; bottom: 2%; width: 66%; height: 26%;
    transform: translateX(-50%); border-radius: 50%;
    background:
      radial-gradient(26% 30% at 50% 4%, rgba(235, 243, 255, .20), transparent 72%),
      radial-gradient(50% 62% at 50% 12%, rgba(210, 225, 255, .14), transparent 70%),
      radial-gradient(62% 84% at 50% 34%, rgba(0, 0, 0, .5), transparent 74%);
    filter: blur(7px);
  }
  .ins-tilt { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transform-style: preserve-3d; cursor: grab; touch-action: none; }
  .ins-tilt.dragging { cursor: grabbing; }
  .ins-card { position: relative; width: 173px; height: 242px; zoom: var(--ins-scale, 1.85); transform-style: preserve-3d; }
  .ins-card .mcd-card { width: 100%; height: 100%; }
  .ins-card .mcd-face { box-shadow: inset 0 1px 0 rgba(235, 242, 255, .16), inset 0 -1px 0 rgba(255, 220, 180, .10),
    0 0 0 1px rgba(215, 228, 255, .12), 0 0 26px rgba(190, 210, 255, .10), 0 20px 74px rgba(0, 0, 0, .78); }
  .ins-card::after {            /* card edge: a bright plate 3px behind gives visible thickness at angles */
    content: ""; position: absolute; inset: 2px; z-index: -1; border-radius: 11px;
    transform: translateZ(-3px);
    background: linear-gradient(115deg, rgba(238, 242, 250, .30), rgba(160, 168, 185, .16) 60%, rgba(120, 126, 140, .10));
  }
  .ins-glow {                   /* RIM: ambient separation glow around reflective edges */
    position: absolute; inset: -26px; z-index: -1; pointer-events: none; border-radius: 28px;
    background: radial-gradient(56% 50% at 50% 46%, rgba(214, 228, 255, .15), transparent 68%);
    filter: blur(12px);
  }
  .ins-sheen {
    position: absolute; inset: -2px; z-index: 3; pointer-events: none; border-radius: 14px;
    background: radial-gradient(circle at var(--sx, 50%) var(--sy, 50%), rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 58%);
    mix-blend-mode: screen;
  }
  /* the lightroom is ALWAYS near-black, so the panel uses fixed light-on-dark colours —
     theme vars would make a light theme's text invisible on the dark studio */
  .ins-info {
    position: relative; width: 330px; max-height: 84vh; overflow: auto;
    background: rgba(16, 18, 23, .92);
    border: 1px solid rgba(255, 255, 255, .13); border-radius: 14px; padding: 14px 16px 12px;
    box-shadow: 0 20px 46px rgba(0, 0, 0, .6); color: #eef2f8;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .ins-head { margin-bottom: 8px; }
  .ins-name { font-size: 16px; font-weight: 700; color: #ffd9a0; line-height: 1.25; }
  .ins-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .ins-chip { font: 10px var(--mono); color: #c6cfdb; border: 1px solid rgba(255, 255, 255, .18); border-radius: 7px; padding: 2px 7px; background: rgba(255, 255, 255, .07); }
  .ins-stats { font-size: 12.5px; line-height: 1.6; color: #f2f6fb; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .14); border-radius: 9px; padding: 8px 10px; margin: 8px 0; white-space: pre-line; }
  .ins-info .mcd-grade { color: #d8e0ea; background: rgba(255, 255, 255, .07); border-color: rgba(255, 255, 255, .14); }
  .ins-info .mcd-grade b { color: #f2f6fb; }
  .ins-row { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; line-height: 1.95; border-bottom: 1px dashed rgba(255, 255, 255, .18); }
  .ins-row:last-of-type { border-bottom: 0; }
  .ins-lbl { color: #bac4d2; }
  .ins-val { color: #f4f8fd; font-weight: 600; text-align: right; }
  .ins-bar { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .ins-bar .mcd-btn { padding: 8px 14px; background: rgba(255, 255, 255, .13); border-color: rgba(255, 255, 255, .32); color: #f2f6fb; }
  .ins-bar .mcd-btn:hover { background: rgba(255, 255, 255, .18); }
  .ins-market { text-decoration: none; display: inline-flex; align-items: center; }
  @media (max-width: 880px) {
    .ins-body { flex-direction: column; gap: 16px; max-height: 92vh; overflow: auto; }
    .ins-stage { width: 250px; height: 330px; }
    .ins-card { --ins-scale: 1.3; }
    .ins-info { width: min(92vw, 430px); max-height: none; }
    .ins-bar { bottom: 12px; }
    .ins-glow { inset: -18px; }
  }

  /* the back of a card carries the card's own facts only */
  .mcd-grade { font: 10.5px var(--mono); color: var(--muted); line-height: 1.6; }
  .mcd-grade b { color: var(--text); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .mcd-inner { transition: none; }
  }
</style>
  <link rel="stylesheet" href="/icons.css">
  <script src="/icons.js" defer></script>

<body data-shell="cards" data-shell-actions="">
<!-- The chrome (header: brand, #chips, search, sound, theme + panel, the settings/back
     link, #syncState, #refresh, PNG, and the left rail #mainnav) is rendered by /shell.js
     from this page's data-shell declaration. -->

<div class="shellbody">
<div class="shellcol">
<nav class="mainnav subnav" aria-label="Collection sections">
  <a href="/collection.html" class="navpill" data-v="collection">Collection</a>
  <a href="/cards.html" class="navpill active" data-v="cards" aria-current="page">Cards</a>
</nav>

<main class="mcd-wrap">
  <div class="mcd-bar">
    <div class="search mcd-search">
      <span class="si i-only-host" data-icon="magnifying-glass" aria-hidden="true"></span>
      <input id="q" type="text" placeholder="Search mods…"
             autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search mods">
      <button class="mcd-clear hidden" id="clearBtn" type="button" title="Clear search" aria-label="Clear search" data-icon="x"></button>
    </div>
    <label class="mcd-lbl" for="typeSel" data-icon="funnel">Type</label>
    <select class="mcd-select" id="typeSel" aria-label="Filter by mod type">
      <option value="">All types</option>
    </select>
    <label class="mcd-lbl" for="sortSel" data-icon="arrows-left-right">Sort</label>
    <select class="mcd-select" id="sortSel" aria-label="Sort cards">
      <option value="owned">Owned first (rarity, name)</option>
      <option value="name">Name (A–Z)</option>
      <option value="rarity">Rarity (best first)</option>
      <option value="copies">Copies (most first)</option>
      <option value="value">Sell floor (highest first)</option>
    </select>
  </div>

  <div class="mcd-filters">
    <div class="mcd-row" id="rarityRow" role="group" aria-label="Rarity filter">
      <span class="mcd-lbl">Rarity</span>
      <button class="mcd-btn rar active" type="button" data-rar="">All</button>
    </div>

    <div class="mcd-row" id="stateRow" role="group" aria-label="Ownership filter">
      <span class="mcd-lbl">State</span>
      <button class="mcd-btn active" type="button" data-state="owned" aria-pressed="true">Owned</button>
      <button class="mcd-btn active" type="button" data-state="missing" aria-pressed="true">Missing</button>
      <button class="mcd-btn" type="button" data-state="dupes" aria-pressed="false">Dupes ×N</button>
      <span class="mcd-sep"></span>
      <button class="mcd-btn" type="button" id="resetBtn" data-icon="arrows-clockwise">Reset filters</button>
    </div>
  </div>

  <div class="mcd-meta" id="meta">Loading mod cards…</div>
  <div class="mcd-grid" id="grid" role="list" aria-label="Mod cards"></div>
  <div class="mcd-more hidden" id="moreWrap"><button class="btn primary" type="button" id="moreBtn">Show more</button></div>
  <div class="mcd-empty hidden" id="empty"></div>
</main>
</div><!-- /shellcol -->
</div><!-- /shellbody -->

<footer class="mcd-foot">
  <span id="srcLine">Cards built by <code>scripts/mod_cards.py</code> → <code>data/mod_cards.json</code></span> ·
  <a href="/#search">item search</a> · <a href="/">back to dashboard</a>
</footer>

<script src="/shell.js"></script>
<script src="/adv.js"></script>
<script src="/sfx.js"></script>
<script src="/theme.js"></script>
<script>wfmInitThemeUI();</script>
<script src="/cards.js"></script>
<script src="/drawer.js" defer></script>
</body>
</html>
