<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WFM Trader · Item price</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<style>
  /* ---- item price page (page-specific, built on the dashboard's CSS vars) ---- */
  .ip-wrap { padding: 14px 18px 40px; max-width: 1180px; margin: 0 auto; }
  .ip-h1 { font-size: 17px; font-weight: 700; letter-spacing: .2px; margin: 8px 2px 3px; display: flex; align-items: center; gap: 9px; }
  .ip-h1 img { width: 26px; height: 26px; border-radius: 4px; background: var(--panel2); }
  .ip-lead { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 0 2px 16px; }
  .ip-lead b { color: var(--text); }
  .ip-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .ip-chip { border: 1px solid var(--border); background: var(--panel2); border-radius: 999px; padding: 3px 10px; font-size: 11px; color: var(--muted); }
  .ip-chip b { color: var(--text); font-weight: 700; }
  .ip-chip.hi { border-color: var(--accent-dim); color: var(--accent); }
  .ip-chart { position: relative; height: 320px; padding: 6px 10px 0; }
  .ip-chart canvas { display: block; }
  #ipTip { position: absolute; transform: translate(-50%, -100%); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 11.5px; line-height: 1.45; pointer-events: none; white-space: nowrap; z-index: 3; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  #ipTip.hidden { display: none; }
  .ip-views { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 16px 0; }
  .ip-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 16px 14px; color: var(--muted); font-size: 11px; }
  .ip-foot .sp { margin-left: auto; }
  .ip-cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0 16px; align-items: start; }
  @media (max-width: 1000px) { .ip-cols { grid-template-columns: minmax(0, 1fr); } }
  .ip-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .ip-table th { text-align: left; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; font-size: 10px; padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .ip-table td { padding: 6px 8px; border-top: 1px solid color-mix(in srgb, var(--border) 40%, transparent); }
  .ip-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .ip-table tr:last-child td { border-bottom: 0; }
  .ip-note { color: var(--muted); font-size: 11.5px; line-height: 1.6; padding: 10px 16px 14px; }
  .ip-pick { padding: 10px 16px 16px; }
  .ip-pick input { width: 100%; max-width: 420px; background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 9px 11px; font: 13px var(--sans); }
  .ip-list { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 0 0; }
  .ip-list a { border: 1px solid var(--border); background: var(--panel2); color: var(--text); border-radius: 999px; padding: 4px 11px; font-size: 12px; text-decoration: none; }
  .ip-list a:hover { border-color: var(--accent); }
  .ip-kind { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); max-width: 260px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
  .ip-kind.wrap { white-space: normal; text-transform: none; letter-spacing: 0; font-size: 11px; line-height: 1.5; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo"><img src="/favicon.png" alt=""></span> WFM Trader <span class="sub">item price</span></div>
  <div class="chips" id="chips"></div>
  <div class="actions">
    <button id="soundBtn" class="btn icon" title="Click sounds" aria-label="Click sounds" aria-pressed="true">&#9834;</button>
    <button id="themeBtn" class="btn icon" title="Change theme" aria-expanded="false" aria-controls="themePanel">&#9686; Theme</button>
    <a class="btn" href="/#inventory">&#9664; Inventory</a>
  </div>
  <div id="themePanel" class="theme-panel hidden">
    <div class="tp-head">Choose a theme <span id="themeName" class="dim"></span></div>
    <div id="themeGrid" class="tp-grid"></div>
  </div>
</header>

<nav class="mainnav" id="mainnav" aria-label="Primary">
  <a href="/#home" class="navpill" data-v="home">Home</a>
  <a href="/#inventory" class="navpill" data-v="inventory">Inventory</a>
  <a href="/#trade" class="navpill" data-v="trade">Trade</a>
  <a href="/collection.html" class="navpill" data-v="collection">Collection</a>
  <a href="/#more" class="navpill" data-v="more">More</a>
</nav>

<main class="ip-wrap">
  <h1 class="ip-h1" id="ipTitle">Item price</h1>
  <p class="ip-lead" id="ipLead">Pick an item to see its price history, your trades and the order book.</p>

  <section class="card hidden" id="ipPickCard">
    <div class="card-head"><h2 class="card-title">Choose an item</h2><span class="dim">type to filter</span></div>
    <div class="ip-pick">
      <input id="ipPick" type="search" placeholder="Search the catalogue, e.g. Primed Continuity" autocomplete="off" spellcheck="false">
      <div class="ip-list" id="ipList"></div>
    </div>
  </section>

  <section class="card hidden" id="ipChartCard">
    <div class="card-head">
      <h2 class="card-title">Price history</h2>
      <span class="dim" id="ipCadence">hourly snapshots</span>
    </div>
    <div class="ip-views chartviews" id="ipViews"></div>
    <div class="ip-chart"><canvas id="ipChart"></canvas><div id="ipTip" class="hidden"></div></div>
    <div class="ip-foot">
      <span id="ipMeta">no points yet</span>
      <span class="sp" id="ipHint"></span>
    </div>
  </section>

  <div class="ip-cols">
    <section class="card hidden" id="ipTradesCard">
      <div class="card-head"><h2 class="card-title">Your trades</h2><span class="dim" id="ipTradesCount"></span></div>
      <div id="ipTrades"></div>
    </section>
    <section class="card hidden" id="ipStatsCard">
      <div class="card-head"><h2 class="card-title">Snapshot &amp; book</h2><span class="dim">local snapshot</span></div>
      <div class="ip-chips" id="ipChips"></div>
      <div id="ipStats"></div>
    </section>
  </div>
</main>

<script src="/adv.js"></script>
<script src="/sfx.js"></script>
<script src="/theme.js"></script>
<script src="/chart.js"></script>
<script src="/item.js"></script>
</body>
</html>
