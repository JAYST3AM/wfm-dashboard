<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WFM Trader · Item price</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/shell.css">
<style>
  /* ---- item price page (page-specific, built on the dashboard's CSS vars) ----
     Density (Jay 2026-09-27): same cards, same rows, same graph - only the air between them goes,
     and the wide screen is used sideways: the graph takes column one while your trades and the
     book stack in column two from 1200px (the Trade view's band). One column below that. */
  .ip-wrap { padding: 10px 18px 24px; max-width: 1520px; margin: 0 auto; }
  /* stage 9: the page states what it is - this surface is the analysis, the shared drawer is the
     quick look (and the drawer's one action lands here) */
  .ip-role { font-size: 10.5px; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); margin: 2px 2px 0; }
  .ip-role b { color: var(--accent); font-weight: 700; }
  .ip-h1 { font-size: 17px; font-weight: 700; letter-spacing: .2px; margin: 6px 2px 2px; display: flex; align-items: center; gap: 9px; }
  .ip-h1 img { width: 26px; height: 26px; border-radius: 4px; background: var(--panel2); }
  .ip-lead { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 0 2px 8px; }
  .ip-lead b { color: var(--text); }
  .ip-wrap .card-head { padding: 6px 12px 0; gap: 8px; flex-wrap: wrap; }
  .ip-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px 12px; align-items: start; }
  .ip-grid > .card { margin-bottom: 0; animation: wfm-rise .26s cubic-bezier(.22, .61, .36, 1) both; }
  /* >=1200px: the graph and the book share row one; the trades table (five columns) keeps the
     full width on row two so no cell is clipped. Below 1200px every card is full width. */
  @media (min-width: 1200px) {
    .ip-grid { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
    #ipChartCard { grid-column: 1; grid-row: 1; }
    #ipStatsCard { grid-column: 2; grid-row: 1; }
    #ipTradesCard { grid-column: 1 / -1; grid-row: 2; }
  }
  .ip-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
  .ip-chip { border: 1px solid var(--border); background: var(--panel2); border-radius: 999px; padding: 3px 10px; font-size: 11px; color: var(--muted); }
  .ip-chip b { color: var(--text); font-weight: 700; }
  .ip-chip.hi { border-color: var(--accent-dim); color: var(--accent); }
  /* the chart canvas is sized from the wrapper's clientWidth, so the wrapper carries no
     horizontal padding (10px of the canvas was clipped on the right before) */
  .ip-chart { position: relative; height: 320px; padding: 6px 0 0; }
  .ip-chart canvas { display: block; }
  #ipTip { position: absolute; transform: translate(-50%, -100%); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 11.5px; line-height: 1.45; pointer-events: none; white-space: nowrap; z-index: 3; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  #ipTip.hidden { display: none; }
  .ip-views { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 12px 0; }
  .ip-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 5px 12px 9px; color: var(--muted); font-size: 11px; }
  .ip-foot .sp { margin-left: auto; }
  .ip-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .ip-table th { text-align: left; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; font-size: 10px; padding: 5px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .ip-table td { padding: 3px 8px; border-top: 1px solid color-mix(in srgb, var(--border) 40%, transparent); }
  .ip-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .ip-table tr:last-child td { border-bottom: 0; }
  .ip-note { color: var(--muted); font-size: 11.5px; line-height: 1.6; padding: 6px 12px 8px; }
  .ip-pick { padding: 8px 12px 10px; }
  .ip-pick input { width: 100%; max-width: 420px; background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 11px; font: 13px var(--sans); }
  .ip-list { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0 0; }
  .ip-list a { border: 1px solid var(--border); background: var(--panel2); color: var(--text); border-radius: 999px; padding: 4px 11px; font-size: 12px; text-decoration: none; }
  .ip-list a:hover { border-color: var(--accent); }
  .ip-kind { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); max-width: 260px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
  .ip-kind.wrap { white-space: normal; text-transform: none; letter-spacing: 0; font-size: 11px; line-height: 1.5; }
</style>
  <link rel="stylesheet" href="/icons.css">
  <script src="/icons.js" defer></script>
</head>
<body data-shell="item" data-shell-actions="">
<!-- The chrome (header: brand, #chips, search, sound, theme + panel, the settings/back
     link, #syncState, #refresh, PNG, and the left rail #mainnav) is rendered by /shell.js
     from this page's data-shell declaration. -->

<div class="shellbody">

<main class="ip-wrap">
  <h1 class="ip-h1" id="ipTitle">Item price</h1>
  <p class="ip-role" id="ipRole"><b>Full analysis</b> · quick look in the drawer</p>
  <p class="ip-lead" id="ipLead">No item selected</p>

  <section class="card hidden" id="ipPickCard">
    <div class="card-head"><h2 class="card-title" data-icon="magnifying-glass">Choose an item</h2><span class="dim">type to filter</span></div>
    <div class="ip-pick">
      <input id="ipPick" type="search" placeholder="Search the catalogue, e.g. Primed Continuity" autocomplete="off" spellcheck="false">
      <div class="ip-list" id="ipList"></div>
    </div>
  </section>

  <div class="ip-grid">
    <section class="card hidden" id="ipChartCard">
      <div class="card-head">
        <h2 class="card-title" data-icon="clock-counter-clockwise">Price history</h2>
        <span class="dim" id="ipCadence">hourly snapshots</span>
      </div>
      <div class="ip-views chartviews" id="ipViews"></div>
      <div class="ip-chart"><canvas id="ipChart"></canvas><div id="ipTip" class="hidden"></div></div>
      <div class="ip-foot">
        <span id="ipMeta">no points yet</span>
        <span class="sp" id="ipHint"></span>
      </div>
    </section>

    <section class="card hidden" id="ipTradesCard">
      <div class="card-head"><h2 class="card-title" data-icon="handshake">Your trades</h2><span class="dim" id="ipTradesCount"></span></div>
      <div id="ipTrades"></div>
    </section>

    <section class="card hidden" id="ipStatsCard">
      <div class="card-head"><h2 class="card-title" data-icon="table">Snapshot &amp; book</h2><span class="dim">local snapshot</span></div>
      <div class="ip-chips" id="ipChips"></div>
      <div id="ipStats"></div>
    </section>
  </div>
</main>
</div><!-- /shellbody -->

<script src="/shell.js"></script>
<script src="/adv.js"></script>
<script src="/sfx.js"></script>
<script src="/theme.js"></script>
<script src="/chart.js"></script>
<script src="/item.js"></script>
</body>
</html>
