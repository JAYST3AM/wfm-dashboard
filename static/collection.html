<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WFM Trader · Collection Log</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.warframestat.us" crossorigin>
<link rel="stylesheet" href="/style.css">

<style>
  /* ---- collection log page (page-specific, built on the dashboard's CSS vars) ----
     The density layer (shell, completion card, toolbar, tabs, the item grid) lives in
     /collection.css so it stays in one place; what stays here is what other tests pin in this
     file (the .cl-tip hover card + its rows, the docked relic card) and what only this page
     draws. */
  /* The page head (title + counts + the section row) and the rest of the density layer - search
     row, category strip, one-line meta, item grid - live in /collection.css so they stay in one
     place. The section row is inside the head now (it used to sit above the wrapper), so no
     page-local .mainnav.subnav override is needed any more. */

  /* ---------- how-to-obtain hover card (Jay: "hover over for information on where to get it,
     and drop chance. and mission") ---------- */
  .cl-tip {
    position: fixed; z-index: 92; max-width: 540px; min-width: 260px; max-height: 62vh;
    overflow: auto; padding: 8px 10px 9px; border: 1px solid var(--border);
    border-radius: var(--r); background: var(--panel2); color: var(--text);
    box-shadow: 0 14px 36px rgba(0, 0, 0, .5); opacity: 0; transform: translateY(3px);
    pointer-events: none; transition: opacity .12s ease, transform .12s ease;
    font-size: 11px; line-height: 1.4;
  }
  .cl-tip.on { opacity: 1; transform: none; }
  .clt-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
  .clt-name { font-weight: 650; font-size: 12px; }
  .clt-state { color: var(--muted); font-family: var(--mono); font-size: 10.5px; }
  .clt-row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: baseline;
    padding: 2.5px 0; border-top: 1px solid color-mix(in srgb, var(--border) 65%, transparent);
  }
  .clt-part {
    color: var(--accent); font-family: var(--mono); font-size: 10.5px; margin-right: 7px;
    white-space: nowrap;
  }
  .clt-src { min-width: 0; }
  .clt-chance {
    color: var(--muted); font-family: var(--mono); font-size: 10.5px; text-align: right;
    white-space: nowrap;
  }
  .clt-row[data-k="relic"] .clt-src, .clt-row[data-k="market"] .clt-src { color: var(--accent); }
  .clt-row[data-k="enemy"] .clt-src { color: var(--text); }
  .clt-row.clt-prose { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .clt-tag { color: var(--accent); font-family: var(--mono); font-size: 10.5px; }
  .clt-row.clt-prose[data-k="introduced"] .clt-tag { color: var(--muted); }
  /* a drop row whose node the game's region data does not describe: full width, quiet, and never
     colour-coded as a chance - it qualifies the row above it, it does not compete with it. */
  .clt-caveat {
    grid-column: 1 / -1; color: var(--muted); font-size: 10px; font-style: italic;
    border-top: none; padding-top: 0; margin-top: -1px;
  }
  .clt-text { color: var(--text); }
  .clt-note { margin-top: 7px; color: var(--muted); font-size: 11px; }
  .clt-wiki { margin-top: 6px; color: var(--muted); font-size: 10.5px; font-family: var(--mono); }
  .clt-more { margin-top: 5px; color: var(--muted); font-family: var(--mono); font-size: 10.5px; }

  /* ---------- Phosphor icons (icons.js renders every [data-icon] host) ----------
     Icons ride on currentColor and 1em, so an icon can only take the size of the label it sits
     in and can never change a row's metrics. The rules below are the spacing the hosts cannot
     give themselves, plus the two sizes the icon-only hosts need. */
  .cl-tab-ico { margin-right: 5px; }                  /* tab label follows the icon */
  .cl-floor .i-before { margin-right: 0; }            /* the pill's own flex gap spaces it */
  .cl-empty-ico {
    display: block; font-size: 30px; line-height: 1; color: var(--muted);
    opacity: .5; margin: 0 0 8px;
  }
  .clt-state.clt-got .i { color: var(--accent); }     /* collected tick in the card head */

  /* ---------- Relics tab: one dense, sortable table over /relics_panel.json ----------
     Not tiles: 805 relics share a handful of images and would read as noise. The table reuses the
     dashboard's .tablewrap / table look (sticky head, sideways scroll inside its own box), so the
     page never scrolls horizontally because of it. */
  #grid.hidden { display: none; }                  /* .cl-grid sets display: grid, .hidden alone loses */
  .cl-relview.hidden { display: none; }
  /* The relic detail card is DOCKED in its own left column (sticky, so it stays in view while the
     table scrolls) - it never follows the pointer and never covers a row. The split is
     viewport-driven: >=1500px gives the card 360px, 1200-1499px 300px, and below 1200px the card
     stacks above the table as a plain block. No JS measures anything. */
  .cl-relsplit { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 12px; }
  .cl-reldock { position: relative; min-width: 0; }
  .cl-relmain { min-width: 0; }
  .cl-tip.docked {
    position: sticky; top: 10px; z-index: 1; width: 100%; min-width: 0; max-width: none;
    max-height: calc(100vh - 240px); opacity: 1; transform: none;
  }
  @media (max-width: 1499px) { .cl-relsplit { grid-template-columns: 300px minmax(0, 1fr); } }
  @media (max-width: 1199px) {
    .cl-relsplit { grid-template-columns: minmax(0, 1fr); }
    .cl-tip.docked { position: static; max-height: 220px; }
  }
  /* on a wide screen the Relics view takes the room the docked card + the 7-column table need
     (collection.css gives the whole page that cap from 1500px; this rule keeps the Relics
     view's own guarantee even if the shell's cap ever moves) */
  @media (min-width: 1500px) { .cl-wrap:has(#relicView:not(.hidden)) { max-width: 1680px; } }
  .cl-relpills { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 8px; }
  .cl-relpill { padding: 4px 12px; }
  .cl-relpill b {
    margin-left: 6px; font-family: var(--mono); font-weight: 600; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .cl-relpill[aria-pressed="true"] { color: var(--accent); border-color: var(--accent-dim); }
  .cl-relpill[aria-pressed="true"] b { color: var(--accent); }
  /* the tile filters mean nothing to a relic table: the pill row replaces them while it is open */
  .cl-controls.rel #missBtn, .cl-controls.rel #priceBtn { display: none; }
  /* the table box fills what the overall card + toolbar leave, and never shrinks past a usable box */
  .cl-relwrap { max-height: max(320px, calc(100vh - 420px)); }
  /* one relic per 23px line (was 26): padding 3px 9px at 11.5px/1.35 keeps the same seven
     columns and the same honest counts - only the air between the rows goes */
  .cl-reltab tbody td { padding: 3px 9px; font-size: 11.5px; line-height: 1.35; }
  /* the table reads column-wise: tabular figures everywhere, the Owned counts right-aligned */
  .cl-reltab { font-variant-numeric: tabular-nums; }
  .cl-reltab td.cl-rownd, .cl-reltab th[data-k="owned"] { text-align: right; }
  .cl-reltab tbody tr:hover { background: var(--hover); }
  .cl-reltab tbody tr.sel {
    background: color-mix(in srgb, var(--accent) 9%, var(--hover));
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .cl-rstate { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .cl-rstate.drop { color: var(--accent); }        /* dropping now: the one state that can be farmed */
  .cl-rownd, .cl-rrare, .cl-rref, .cl-rnone { font-family: var(--mono); font-size: 10.5px; }
  .cl-rownd { color: var(--text); }
  .cl-rrare { color: var(--muted); margin-left: 7px; }
  .cl-rref { color: var(--accent); margin-left: 5px; }   /* was --accent-dim: unreadable (1.85:1) on the dark-red palettes like Kuva Crimson; every palette keeps accent >= 3:1 vs panel (tests/test_themes.py) */
  .cl-rnone { color: var(--muted); }
  .cl-rbest, .cl-rwhere { overflow: hidden; }
  /* a long drop label or reward name is clipped, not wrapped: `nowrap` on a table cell beats a
     max-width, so the cap has to sit on an inner inline-block. The full text rides in the title
     (and in the hover card). */
  td.cl-rwhere { width: 320px; }
  .cl-rwheretxt, .cl-rbitem {
    display: inline-block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    vertical-align: bottom;
  }
  .cl-rwheretxt { max-width: 320px; }
  .cl-rbitem { max-width: 260px; }
  th .cl-rsort { margin-left: 6px; font-size: 10px; opacity: 0; }   /* only the active column marks */
  th.sorted .cl-rsort, th:hover .cl-rsort { opacity: .8; }
  th .cl-rsort.asc .i { transform: rotate(180deg); }                /* asc flips the caret up */

  /* card blocks the relic card adds: two section labels, the refinement switcher, the market line.
     The card stays pointer-transparent wherever it sits - only the refinement chips take the
     pointer - so even docked beside the table it can never swallow a hover or a click meant for a
     row. In the Relics view the card is docked in #relDock (sticky left column); the tile grid
     keeps the same card floating beside the hovered tile. */
  .clt-sect {
    margin: 8px 0 3px; color: var(--muted); font-size: 10px;
    text-transform: uppercase; letter-spacing: .6px;
  }
  .clt-refs { display: flex; gap: 4px; flex-wrap: wrap; }
  .clt-ref {
    pointer-events: auto; font: 10.5px var(--mono); color: var(--muted); background: var(--panel2);
    border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; cursor: pointer;
  }
  .clt-ref:hover { color: var(--text); border-color: var(--accent-dim); }
  .clt-ref[aria-pressed="true"] { color: var(--accent); border-color: var(--accent-dim); }
  .clt-foot { margin-top: 5px; }
  .clt-state.clt-drop .i { color: var(--accent); }  /* a relic that is dropping now */

  /* 14 tabs carrying an icon each get busy on a narrow screen: the strip keeps its icons only
     where there is room (>=900px); below that the tabs render exactly as they did before. */
  @media (max-width: 899px) { .cl-tab-ico { display: none; } }
</style>
  <link rel="stylesheet" href="/icons.css">
  <script src="/icons.js" defer></script>
</head>
<body data-shell="collection" data-shell-actions="">
<!-- The chrome (header: brand, #chips, search, sound, theme + panel, the settings/back
     link, #syncState, #refresh, PNG, and the left rail #mainnav) is rendered by /shell.js
     from this page's data-shell declaration. -->

<div class="shellbody">
<div class="shellcol">

<main class="cl-wrap">
  <!-- Page head (stage 6): the page title + the log's own counts, the progress hairline, then the
       section row - Collection | Relics | Mastery | Cards. The row is THE navigation for this
       page: the first three are sections of it (hash-routed, deep-linkable: #relics, #mastery,
       and #collection for the default), Cards keeps its own page and is linked from the row.
       Exactly one section renders under the head. -->
  <div class="cl-overall" id="overall">
    <div class="cl-ov-head">
      <h1 class="cl-title" data-icon="squares-four">Collection</h1>
      <span class="cl-ov-num" id="ovPct">—</span>
      <span class="cl-ov-sub" id="ovCount">loading…</span>
      <span class="cl-ov-foot" id="ovFoot"></span>
    </div>
    <div class="cl-bar"><i id="ovBar" style="width:0%"></i></div>
    <nav class="mainnav subnav" id="collectionNav" aria-label="Collection sections">
      <a href="/collection.html" class="navpill active" data-v="collection" data-icon="squares-four" aria-current="page">Collection</a>
      <a href="/collection.html#relics" class="navpill" data-v="relics" data-icon="tray">Relics</a>
      <a href="/collection.html#mastery" class="navpill" data-v="mastery" data-icon="trophy">Mastery</a>
      <a href="/cards.html" class="navpill" data-v="cards" data-icon="stack">Cards</a>
    </nav>
  </div>

  <div class="cl-controls">
    <div class="search cl-search">
      <span class="si" data-icon="magnifying-glass"></span>
      <input id="q" type="text" placeholder="Search this category…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search collection items">
      <button class="cl-clear hidden" id="clearBtn" type="button" data-icon="x" title="Clear search" aria-label="Clear search"></button>
    </div>
    <button class="btn cl-toggle" id="missBtn" type="button" aria-pressed="false" title="Show only what is still missing">
      <span class="cl-ico" data-icon="funnel"></span><span class="box">✓</span> Missing only
    </button>
    <button class="btn cl-toggle" id="priceBtn" type="button" aria-pressed="false">
      <span class="cl-ico" data-icon="tag"></span><span class="box">✓</span> Buyable
    </button>
  </div>

  <div class="tabs cl-tabs" id="tabs" role="tablist" aria-label="Collection categories"></div>
  <div class="cl-meta" id="meta">Loading collection log…</div>
  <div class="cl-grid" id="grid" role="list" aria-label="Catalog items"></div>
  <div class="cl-empty hidden" id="empty"></div>

  <!-- Relics: one dense sortable table over /relics_panel.json plus the relic detail card, docked
       in the left column (#relDock, sticky) so it never follows the pointer or covers a row.
       collection.js fetches the store once (it also feeds the tab count and the pill counts);
       nothing in this block refetches. -->
  <section class="cl-relview hidden" id="relicView" aria-label="Relics">
    <div class="cl-relpills" id="relPills" role="group" aria-label="Relic filters"></div>
    <div class="cl-relsplit">
      <aside class="cl-reldock" id="relDock" aria-label="Relic detail"></aside>
      <div class="cl-relmain">
        <div class="tablewrap cl-relwrap">
          <table class="cl-reltab" id="relTable">
            <thead id="relHead"></thead>
            <tbody id="relBody"></tbody>
          </table>
        </div>
        <div class="cl-empty hidden" id="relNote"></div>
      </div>
    </div>
  </section>

  <!-- Mastery (stage 2): the helper that used to be its own rail destination. Same cards, same
       ids, same renderer behaviour (filters / categories / 60-row cap) - rendered by
       /collection.js from /api/feature/mastery. Hidden until its section opens. -->
  <section class="cl-mhview hidden" id="view-mastery" aria-label="Mastery helper">
    <div class="card" id="mhCard">
      <div class="card-head"><div class="card-title" data-icon="trophy">Mastery Helper <span class="dim small" id="mhMeta"></span></div></div>
      <div id="mhHead"></div>
      <div class="kpis" id="mhStats"></div>
    </div>
    <div class="card" id="mhNextCard">
      <div class="card-head">
        <div class="card-title" data-icon="target">Do this next <span class="dim small" id="mhNextMeta"></span></div>
        <div class="ranges" id="mhFilters" role="group" aria-label="Mastery filters"></div>
      </div>
      <div id="mhNext"></div>
      <div id="mhCap" class="mat-cap dim small"></div>
    </div>
    <div class="card" id="mhCatsCard">
      <div class="card-head"><div class="card-title" data-icon="chart-bar">Progress by type <span class="dim small" id="mhCatsMeta"></span></div></div>
      <div id="mhCats"></div>
    </div>
  </section>
</main>
</div><!-- /shellcol -->
</div><!-- /shellbody -->

<footer class="cl-foot" title="Collection log built by scripts/collection_log.py · item icons from the WFCD image CDN · floor prices from this PC's local WFM snapshot (data/prices.json)">
  <span id="srcLine">Collection log built by <code>scripts/collection_log.py</code></span> ·
  <span>item icons: WFCD CDN</span> · <span>prices: data/prices.json</span> ·
  <a href="/">back to dashboard</a>
</footer>

<script src="/shell.js"></script>
<script src="/adv.js"></script>
<script src="/sfx.js"></script>
<script src="/theme.js"></script>
<script>wfmInitThemeUI();</script>
<script src="/collection.js"></script>
<script src="/drawer.js" defer></script>
</body>
</html>
