name = "wfm-chat"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# One SQLite-backed Durable Object per room (SQLite is the only storage backend available on the
# Workers Free plan; the hibernation-friendly HTTP API is enough for a mates' room).
[[durable_objects.bindings]]
name = "ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]
